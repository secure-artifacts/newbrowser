name: Build and Release with Attestation

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows_x64_普通电脑版
            asset_name: newbrowser-windows

          - os: windows-11-arm
            os_label: Win_ARM64_高通骁龙本专用包
            asset_name: newbrowser-arm64

          - os: macos-latest        # M1/M2/M3 芯片 Runner (arm64)
            os_label: macOS_M芯片新款
            asset_name: newbrowser-macos

          - os: macos-15-intel      # 替代已退役的 macos-13，原生 Intel x86_64 Runner
            os_label: Mac_Intel_老款电脑专用包
            asset_name: newbrowser-intel

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Install dependencies (non-Windows)
        run: |
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if: runner.os != 'Windows'

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller -F -w browser_Gui.py --name BrowserAudit --clean --noconfirm

          $folderName = "浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          $stage = "dist_final/$folderName"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "dist/BrowserAudit.exe" "$stage/浏览器痕迹分析.exe" -Force
          Copy-Item "custom-domains.conf" "$stage/" -Force

          Compress-Archive -Path $stage -DestinationPath "dist_final/${{ matrix.asset_name }}-${{ github.ref_name }}.zip" -Force

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          # 各自的 Runner 本身就是对应架构(arm64 / x86_64),原生构建,无需 --target-arch 交叉编译
          pyinstaller --onedir --windowed --name BrowserAudit browser_Gui.py --clean --noconfirm

          folder_name="浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          stage="dist_final/${folder_name}"
          mkdir -p "$stage"

          # 【纯净打包】:直接拷贝 .app 和配置文件并排,绝不修改 .app 内部文件,杜绝一切签名报错!
          cp -r dist/BrowserAudit.app "$stage/浏览器痕迹分析.app"
          cp custom-domains.conf "$stage/"

          cd dist_final
          zip -r "${{ matrix.asset_name }}-${{ github.ref_name }}.zip" "${folder_name}"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist_final/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_label }}
          path: dist_final/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
