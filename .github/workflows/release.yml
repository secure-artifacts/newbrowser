name: Build and Release with Attestation

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows_x64_普通电脑版
            asset_name: newbrowser-windows

          - os: windows-latest
            os_label: Win_ARM64_高通骁龙本专用包
            asset_name: newbrowser-arm64

          - os: macos-latest
            os_label: macOS_M芯片新款
            asset_name: newbrowser-macos

          - os: macos-latest
            os_label: Mac_Intel_老款电脑专用包
            asset_name: newbrowser-intel

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller -F -w browser_Gui.py --name BrowserAudit --clean --noconfirm
          
          $folderName = "浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          $stage = "dist_final/$folderName"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          
          Copy-Item "dist/BrowserAudit.exe" "$stage/浏览器痕迹分析.exe" -Force
          Copy-Item "custom-domains.conf" "$stage/" -Force
          
          Compress-Archive -Path $stage -DestinationPath "dist_final/${{ matrix.asset_name }}-${{ github.ref_name }}.zip" -Force

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.asset_name }}" == "newbrowser-intel" ]; then
              pyinstaller --onedir --windowed --name BrowserAudit browser_Gui.py --target-arch x86_64 --clean --noconfirm
          else
              pyinstaller --onedir --windowed --name BrowserAudit browser_Gui.py --clean --noconfirm
          fi
          
          folder_name="浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          stage="dist_final/${folder_name}"
          mkdir -p "$stage"
          
          cp -r dist/BrowserAudit.app "$stage/浏览器痕迹分析.app"
          cp custom-domains.conf "$stage/"
          
          # 【高级劫持修复】：防弹级 Bash 脚本
          APP_MACOS_DIR="$stage/浏览器痕迹分析.app/Contents/MacOS"
          mv "$APP_MACOS_DIR/BrowserAudit" "$APP_MACOS_DIR/BrowserAudit_bin"
          
          cat << 'EOF' > "$APP_MACOS_DIR/BrowserAudit"
          #!/bin/bash
          # 极其严谨地获取当前脚本的绝对路径（无视用户在哪里双击，无视路径是否有空格）
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          # 向外跳 4 层，精准定位到与 .app 并排的那个规则文件夹
          TARGET_DIR="$(cd "$SCRIPT_DIR/../../.." && pwd)"
          cd "$TARGET_DIR"
          # 唤醒真身，并将所有系统启动参数（"$@"）原封不动传给主程序
          exec "$SCRIPT_DIR/BrowserAudit_bin" "$@"
          EOF
          
          chmod +x "$APP_MACOS_DIR/BrowserAudit"
          
          # 【最关键的救命补丁：苹果底层重签名】
          # 由于我们修改了 .app 内部结构，必须使用 codesign 强行抹除旧签名并重新颁发本地证书
          # 否则 Mac 系统会认为程序被黑客篡改，直接拦截并提示“已损坏”
          codesign --force --deep -s - "$stage/浏览器痕迹分析.app"
          
          cd dist_final
          zip -r "${{ matrix.asset_name }}-${{ github.ref_name }}.zip" "${folder_name}"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist_final/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_label }}
          path: dist_final/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
