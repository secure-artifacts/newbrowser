name: Build and Release with Attestation

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. 包含 'windows' 关键词，100% 精准绑定左边 Windows 下载大按钮
          - os: windows-latest
            os_label: Windows_x64_普通电脑版
            asset_name: newbrowser-windows

          # 2. 彻底剔除 'win' 字样，改用最标准、无冲突的 'arm64'，100% 自动掉进“其他产物”
          - os: windows-latest
            os_label: Win_ARM64_高通骁龙本专用包
            asset_name: newbrowser-arm64

          # 3. 包含 'macos' 关键词，100% 精准绑定右边 macOS 下载大按钮
          - os: macos-latest
            os_label: macOS_M芯片新款
            asset_name: newbrowser-macos

          # 4. 彻底剔除 'mac' 字样，改用最标准、无冲突的 'intel'，100% 自动掉进“其他产物”
          - os: macos-13
            os_label: Mac_Intel_老款电脑专用包
            asset_name: newbrowser-intel

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller -F -w browser_Gui.py --name BrowserAudit --clean --noconfirm
          
          # 内部解压出来的文件夹和程序名称依然保持你最完美的纯中文
          $folderName = "浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          $stage = "dist_final/$folderName"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          
          Copy-Item "dist/BrowserAudit.exe" "$stage/浏览器痕迹分析.exe" -Force
          Copy-Item "custom-domains.conf" "$stage/" -Force
          
          # 外部压缩包文件名采用隔离匹配的专属资产名
          Compress-Archive -Path $stage -DestinationPath "dist_final/${{ matrix.asset_name }}-${{ github.ref_name }}.zip" -Force

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --name BrowserAudit browser_Gui.py --clean --noconfirm
          
          folder_name="浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          stage="dist_final/${folder_name}"
          mkdir -p "$stage"
          
          cp -r dist/BrowserAudit.app "$stage/浏览器痕迹分析.app"
          cp custom-domains.conf "$stage/"
          
          cd dist_final
          zip -r "${{ matrix.asset_name }}-${{ github.ref_name }}.zip" "${folder_name}"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist_final/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_label }}
          path: dist_final/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
