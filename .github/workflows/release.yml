name: Build and Release with Attestation

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. 对应前端 Windows 大按钮
          - os: windows-latest
            is_main: 'true'
            os_label: Windows_x64_普通电脑版
            py_ver: '3.10'

          # 2. 优雅避让，完美掉进【其他产物】下拉菜单
          - os: windows-11-arm
            is_main: 'false'
            os_label: Win_ARM64_高通骁龙本专用包
            py_ver: '3.11'

          # 3. 对应前端 macOS 大按钮
          - os: macos-latest
            is_main: 'true'
            os_label: macOS_M芯片新款
            py_ver: '3.10'

          # 4. 优雅避让，完美掉进【其他产物】下拉菜单
          - os: macos-15-intel
            is_main: 'false'
            os_label: Mac_Intel_老款电脑专用包
            py_ver: '3.10'

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py_ver }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller -F -w browser_Gui.py --name BrowserAudit --clean --noconfirm
          
          # 智能命名逻辑：主按钮产物加中文前缀，下拉菜单产物保持简洁
          if ('${{ matrix.is_main }}' -eq 'true') {
              $folderName = "浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          } else {
              $folderName = "${{ matrix.os_label }}"
          }
          
          $targetPath = "dist_final/$folderName"
          New-Item -ItemType Directory -Force -Path $targetPath | Out-Null
          
          Copy-Item dist/BrowserAudit.exe $targetPath/
          
          # 动态提取本地的真实全量规则库
          if (Test-Path "custom-domains.conf") {
              Copy-Item "custom-domains.conf" $targetPath/
          } else {
              Write-Host "警告: 未检测到 custom-domains.conf 文件！"
          }
          
          Compress-Archive -Path $targetPath -DestinationPath "dist_final/${folderName}.zip" -Force

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --name BrowserAudit browser_Gui.py --clean --noconfirm
          
          if [ "${{ matrix.is_main }}" == "true" ]; then
              folder_name="浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          else
              folder_name="${{ matrix.os_label }}"
          fi
          
          mkdir -p "dist_final/${folder_name}"
          cp -r dist/BrowserAudit.app "dist_final/${folder_name}/"
          
          if [ -f "custom-domains.conf" ]; then
              cp "custom-domains.conf" "dist_final/${folder_name}/"
          else
              echo "警告: 未检测到 custom-domains.conf 文件!"
          fi
          
          cd dist_final && zip -r "${folder_name}.zip" "${folder_name}"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist_final/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_label }}
          path: dist_final/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
