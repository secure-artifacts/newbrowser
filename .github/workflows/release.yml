name: Build and Release with Attestation

on:
  push:
    tags:
      - 'v*' # 当你推送形如 v1.0.0 的 tag 时触发构建

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest # 必须是 github-hosted 环境

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-with-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Packaging Application
        run: |
          # 模拟打包流程，生成分发归档包
          mkdir dist
          tar -czf dist/newbrowser-source.tar.gz src/ requirements.txt

      - name: Generate GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/newbrowser-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Build Artifacts
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/newbrowser-source.tar.gz'