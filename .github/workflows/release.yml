name: Build and Release with Attestation

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows_x64_普通电脑版
            asset_name: newbrowser-windows

          - os: macos-latest        # M1/M2/M3 芯片 Runner (arm64)
            os_label: macOS_M芯片新款
            asset_name: newbrowser-macos

          - os: macos-15-intel      # 替代已退役的 macos-13，原生 Intel x86_64 Runner
            os_label: Mac_Intel_老款电脑专用包
            asset_name: newbrowser-intel

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Validate release tag (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, received: $env:GITHUB_REF_NAME"
          }

      - name: Validate release tag (macOS)
        if: runner.os == 'macOS'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, received: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.10.0"
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Install dependencies (non-Windows)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.10.0"
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        if: runner.os != 'Windows'

      - name: Run core regression tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:BROWSER_AUDIT_HEADLESS_TESTS = "1"
          python -m unittest discover -s tests -v *>&1 | Tee-Object -FilePath windows-regression-tests.log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            Write-Error "Windows core regression tests failed with exit code $testExitCode."
            exit $testExitCode
          }

      - name: Upload Windows regression test log
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-regression-test-log-${{ github.ref_name }}
          path: windows-regression-tests.log
          if-no-files-found: error
          retention-days: 14

      - name: Run core regression tests (macOS)
        if: runner.os == 'macOS'
        env:
          BROWSER_AUDIT_HEADLESS_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller -F -w browser_Gui.py --name BrowserAudit --clean --noconfirm

          $folderName = "浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          $stage = "dist_final/$folderName"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "dist/BrowserAudit.exe" "$stage/浏览器痕迹分析.exe" -Force
          Copy-Item "custom-domains.conf" "$stage/" -Force

          Compress-Archive -Path $stage -DestinationPath "dist_final/${{ matrix.asset_name }}-${{ github.ref_name }}.zip" -Force

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          # 各自的 Runner 本身就是对应架构(arm64 / x86_64),原生构建,无需 --target-arch 交叉编译
          pyinstaller --onedir --windowed --name BrowserAudit browser_Gui.py --clean --noconfirm

          folder_name="浏览器痕迹分析-${{ github.ref_name }}-${{ matrix.os_label }}"
          stage="dist_final/${folder_name}"
          mkdir -p "$stage"

          # 【纯净打包】:直接拷贝 .app 和配置文件并排,绝不修改 .app 内部文件,杜绝一切签名报错!
          cp -r dist/BrowserAudit.app "$stage/浏览器痕迹分析.app"
          cp custom-domains.conf "$stage/"

          cd dist_final
          zip -r "${{ matrix.asset_name }}-${{ github.ref_name }}.zip" "${folder_name}"

      # 证明直接绑定随后将上传至 Release 的最终 ZIP；中间 Actions Artifact 仅用于跨 Job 传输。
      - name: Attest final Release ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist_final/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.os_label }}
          path: dist_final/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      # 诊断日志仅用于失败排障，绝不作为正式 Release 资产；兼容清理此前失败构建遗留文件。
      - name: Remove stale diagnostic asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset "${{ github.ref_name }}" windows-regression-tests.log --yes || true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/newbrowser-*.zip
          generate_release_notes: true
