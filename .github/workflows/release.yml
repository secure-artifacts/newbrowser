name: Build and Release with Attestation

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. 对应前端 Windows 大按钮
          - os: windows-latest
            platform_suffix: Windows_x64普通电脑版
            py_ver: '3.10'
          # 2. 伪装成 Linux 关键字，强行逼前端多生成一个独立的 Windows ARM 按钮
          - os: windows-11-arm
            platform_suffix: Linux_Windows_ARM64骁龙本
            py_ver: '3.11'
          # 3. 对应前端 macOS 大按钮
          - os: macos-latest
            platform_suffix: macOS_ARM64_M芯片新款
            py_ver: '3.10'
          # 4. 利用特殊的包含逻辑，尝试平铺或通过后台安全兜底
          - os: macos-15-intel
            platform_suffix: macOS_Intel老款电脑
            py_ver: '3.10'

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py_ver }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller -F -w browser_Gui.py --name BrowserAudit --clean --noconfirm
          New-Item -ItemType Directory -Force -Path dist_final | Out-Null
          Copy-Item dist/BrowserAudit.exe dist_final/
          @"
          # 专项审计规则库 (自定义扩展)
          heygen.com=AI视频(HeyGen)
          hailuoai.com=AI服务(海螺AI)
          "@ | Out-File -Encoding utf8 dist_final/custom-domains.conf
          $zip = "newbrowser-${{ github.ref_name }}-${{ matrix.platform_suffix }}.zip"
          Compress-Archive -Path dist_final/* -DestinationPath $zip -Force

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --name BrowserAudit browser_Gui.py --clean --noconfirm
          mkdir -p dist_final
          cp -r dist/BrowserAudit.app dist_final/
          cat > dist_final/custom-domains.conf << 'EOF'
          # 专项审计规则库 (自定义扩展)
          heygen.com=AI视频(HeyGen)
          hailuoai.com=AI服务(海螺AI)
          EOF
          zip_name="newbrowser-${{ github.ref_name }}-${{ matrix.platform_suffix }}.zip"
          cd dist_final && zip -r "../${zip_name}" BrowserAudit.app custom-domains.conf

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: newbrowser-${{ github.ref_name }}-${{ matrix.platform_suffix }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_suffix }}
          path: newbrowser-${{ github.ref_name }}-${{ matrix.platform_suffix }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
