name: Build Test Packages

on:
  push:
    branches:
      - main
      - fix/windows-chrome-compat-v1.2.0-test
      - release/v1.1.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-test:
    name: Windows x64 Test Package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.10.0"

      - name: Run core regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:BROWSER_AUDIT_HEADLESS_TESTS = "1"
          python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller -F -w browser_Gui.py --name BrowserAudit --clean --noconfirm
          $packageName = "浏览器痕迹分析-v1.1.11-test1-Windows-x64"
          $stage = "package/$packageName"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/BrowserAudit.exe" "$stage/浏览器痕迹分析.exe" -Force
          Copy-Item "custom-domains.conf" "$stage/custom-domains.conf" -Force
          Copy-Item "WINDOWS_TEST_GUIDE.md" "$stage/测试说明.md" -Force
          Compress-Archive -Path $stage -DestinationPath "package/$packageName.zip" -Force

      - name: Upload Windows test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 浏览器痕迹分析-v1.1.11-test1-Windows-x64
          path: package/*.zip
          if-no-files-found: error
          retention-days: 14

  test-macos:
    name: macOS arm64 Core and Packaging Test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install build dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.10.0"

      - name: Run core regression tests
        env:
          BROWSER_AUDIT_HEADLESS_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Build macOS app
        run: pyinstaller --onedir --windowed --name BrowserAudit browser_Gui.py --clean --noconfirm

      - name: Verify packaged files
        run: |
          test -d "dist/BrowserAudit.app"
          test -f "custom-domains.conf"
